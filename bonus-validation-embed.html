<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonus validation</title><style>
:root{--panel:oklch(.15 .018 110);--ink:oklch(.94 .01 110);--muted:oklch(.72 .025 110);--line:oklch(.32 .045 110);--signal:oklch(.76 .16 132);--accent:oklch(.68 .15 48)}*{box-sizing:border-box}html,body{width:100%;height:100%;min-height:100%}body{margin:0;background:transparent;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}.ocd-wrap{width:100%;height:100%;max-width:none}.ocd-panel{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.ocd-bar{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.09em;white-space:nowrap}.ocd-bar-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--signal)}.ocd-bar-id{margin-left:auto;color:var(--accent)}.ocd-row{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;padding:24px 18px 18px}.ocd-cell{display:grid;aspect-ratio:1/1.1;width:100%;place-items:center;border:1px solid var(--line);border-radius:8px;background:oklch(.12 .012 110);color:var(--signal);font-size:clamp(20px,7vw,26px);font-weight:800;transition:border-color .2s ease,transform .2s ease}.ocd-cell.is-filled{border-color:var(--signal);transform:translateY(-2px)}.ocd-digit:before{content:"*";opacity:0}.ocd-cell.is-filled .ocd-digit:before{opacity:1}.ocd-scanline{position:absolute;left:12%;right:12%;bottom:8px;height:1px;background:var(--signal);opacity:.45;animation:scan 1.2s ease-in-out infinite}.ocd-out{display:flex;align-items:center;min-height:62px;padding:0 18px 12px;color:var(--muted);font-size:clamp(13px,4.3vw,15px);line-height:1.3}.ocd-prompt{margin-right:8px;color:var(--signal);font-weight:800}.ocd-status{color:var(--ink)}.ocd-cursor{width:8px;height:17px;flex:0 0 8px;margin-left:5px;background:var(--signal);animation:blink .75s steps(2) infinite}.ocd-success{display:none;align-items:flex-start;gap:10px;margin-top:auto;padding:0 18px 18px;color:var(--signal);font-size:clamp(13px,4.3vw,15px);font-weight:700;line-height:1.3}.ocd-success.is-visible{display:flex}.ocd-check{display:grid;width:22px;height:22px;flex:0 0 22px;place-items:center;border:1px solid var(--signal);border-radius:5px;background:oklch(.76 .16 132/.13)}@keyframes blink{50%{opacity:0}}@keyframes scan{50%{opacity:.08;transform:scaleX(.7)}}@media(max-width:280px){.ocd-bar{padding:0 10px;font-size:9px}.ocd-row{gap:4px;padding-inline:12px}.ocd-out,.ocd-success{padding-inline:14px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><div class="ocd-wrap" role="status" aria-live="polite"><div class="ocd-panel"><div class="ocd-bar"><span class="ocd-bar-dot"></span><span>SECURE CHANNEL // BONUS</span><span class="ocd-bar-id">NODE-7</span></div><div class="ocd-row" aria-label="Validación en curso"><span class="ocd-cell"><span class="ocd-digit"></span></span><span class="ocd-cell"><span class="ocd-digit"></span></span><span class="ocd-cell"><span class="ocd-digit"></span></span><span class="ocd-cell"><span class="ocd-digit"></span></span><span class="ocd-cell"><span class="ocd-digit"></span></span><span class="ocd-cell"><span class="ocd-digit"></span></span><span class="ocd-scanline" aria-hidden="true"></span></div><div class="ocd-out"><span class="ocd-prompt">&gt;</span><span class="ocd-status"></span><span class="ocd-cursor"></span></div><div class="ocd-success"><span class="ocd-check">✓</span><span>Todo listo. Bono liberado.</span></div></div></div><script>(()=>{const c=[...document.querySelectorAll('.ocd-cell')],s=document.querySelector('.ocd-status'),ok=document.querySelector('.ocd-success'),cursor=document.querySelector('.ocd-cursor'),m=['Validando tu bono...','Comprobando tu IP...','Liberando el bono para tu IP.'],d=3000;setTimeout(()=>s.textContent=m[0],d);c.forEach((x,i)=>setTimeout(()=>x.classList.add('is-filled'),d+250+i*380));setTimeout(()=>s.textContent=m[1],d+1200);setTimeout(()=>s.textContent=m[2],d+2450);setTimeout(()=>{ok.classList.add('is-visible');cursor.style.display='none'},d+3800)})();</script></body></html>
