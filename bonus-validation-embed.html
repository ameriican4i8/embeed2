<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonus validation</title><style>
:root{--p:oklch(.15 .018 110);--i:oklch(.94 .01 110);--m:oklch(.72 .025 110);--l:oklch(.32 .045 110);--s:oklch(.76 .16 132);--a:oklch(.68 .15 48)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font-family:"Segoe UI",system-ui,sans-serif;color:var(--i)}.panel{display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;border:1px solid var(--l);border-radius:14px;background:var(--p)}.bar{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-bottom:1px solid var(--l);color:var(--m);font-size:10px;font-weight:700;letter-spacing:.09em;white-space:nowrap}.dot,.item:before{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--s)}.id{margin-left:auto;color:var(--a)}.cells{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:24px 14px 19px}.cell{display:grid;aspect-ratio:1/1.1;place-items:center;border:1px solid var(--l);border-radius:8px;background:oklch(.12 .012 110);color:var(--s);font-size:clamp(18px,7vw,26px);font-weight:800;opacity:.45;transform:scale(.88);transition:.25s}.cell.on{border-color:var(--s);opacity:1;transform:scale(1)}.cell span:before{content:"*";opacity:0}.cell.on span:before{opacity:1}.scan{position:absolute;left:12%;right:12%;bottom:8px;height:1px;background:var(--s);opacity:.45;animation:scan 1.2s ease-in-out infinite}.status{display:flex;align-items:center;min-height:54px;padding:0 18px 10px;font-size:14px;font-weight:600}.prompt{margin-right:9px;color:var(--s)}.spin{width:14px;height:14px;flex:0 0 14px;margin-right:8px;border:2px solid oklch(.76 .16 132/.2);border-top-color:var(--s);border-radius:50%;animation:spin .75s linear infinite}.list{display:grid;gap:10px;padding:0 18px 18px;font-size:12px}.item{display:flex;align-items:center;gap:9px;color:var(--m);opacity:.42;transition:.25s}.item:before{content:"";border:1px solid var(--l);background:transparent}.item.active{color:var(--i);opacity:1}.item.active:before{border-color:var(--s);background:var(--s);animation:pulse .8s infinite}.item.done{color:var(--s);opacity:1}.item.done:before{border-color:var(--s);background:var(--s)}.final{display:flex;align-items:center;gap:11px;margin-top:auto;padding:0 18px 20px;color:var(--s);font-size:15px;font-weight:800;opacity:0;transform:translateY(5px);transition:.35s}.final.show{opacity:1;transform:none}.check{display:grid;width:28px;height:28px;place-items:center;border:1px solid var(--s);border-radius:6px;background:oklch(.76 .16 132/.13);font-size:18px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{50%{opacity:.08;transform:scaleX(.7)}}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><div class="panel"><div class="bar"><span class="dot"></span><span>SECURE CHANNEL // BONUS</span><span class="id">NODE-7</span></div><div class="cells"><span class="cell"><span></span></span><span class="cell"><span></span></span><span class="cell"><span></span></span><span class="cell"><span></span></span><span class="cell"><span></span></span><span class="cell"><span></span></span><span class="scan"></span></div><div class="status"><b class="prompt">&gt;</b><span class="spin"></span><span class="text"></span></div><div class="list"><div class="item">Conexi&oacute;n segura iniciada</div><div class="item">Comprobando elegibilidad del bono</div><div class="item">Preparando la liberaci&oacute;n</div></div><div class="final"><span class="check">&#10003;</span><span>Todo listo. Bono liberado.</span></div></div><script>(()=>{const c=[...document.querySelectorAll('.cell')],i=[...document.querySelectorAll('.item')],t=document.querySelector('.text'),f=document.querySelector('.final'),sp=document.querySelector('.spin'),d=3000;let active=n=>i.forEach((x,k)=>x.className='item '+(k<n?'done':k===n?'active':''));setTimeout(()=>{t.textContent='Validando tu IP...';active(0)},d);c.forEach((x,n)=>setTimeout(()=>x.classList.add('on'),d+250+n*380));setTimeout(()=>{t.textContent='Validando tu bono...';active(1)},d+1200);setTimeout(()=>{t.textContent='Liberando el bono para tu IP.';active(2)},d+2450);setTimeout(()=>{i.forEach(x=>x.className='item done');f.classList.add('show');sp.style.display='none'},d+3800)})();</script></body></html>
